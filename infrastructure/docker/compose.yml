name: caelora-platform
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run bootstrap}
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run bootstrap}
    ports: ['127.0.0.1:${POSTGRES_PORT:-55432}:5432']
    volumes: ['postgres-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:8.2.7-alpine
    ports: ['127.0.0.1:${REDIS_PORT:-56379}:6379']
    # Transient local state only. Never expose this unauthenticated service beyond loopback.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
    restart: unless-stopped
  api:
    profiles: ['api']
    build:
      context: ../..
      dockerfile: infrastructure/docker/PlatformApi.Dockerfile
    ports: ['127.0.0.1:${API_PORT:-5080}:8080']
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Platform__PublicOrigin: http://localhost:4321
      Platform__CorsOrigins__0: http://localhost:4200
      Platform__CorsOrigins__1: http://localhost:4300
      Platform__PostgresEnabled: 'true'
      Platform__RedisEnabled: 'true'
      Platform__PostgresConnection: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Timeout=3
      Platform__RedisConnection: redis:6379,abortConnect=false,connectTimeout=2000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    read_only: true
    tmpfs: ['/tmp']
volumes:
  postgres-data:
